kind = "web"
previewPath = "/"
title = "Rohit Paudel — Portfolio"
description = "A cinematic, scroll-driven portfolio for Rohit Paudel, combining game development, marketing, and illustration in an atmospheric post-apocalyptic city. Phase 1 features six parallax scenes and a working hero-to-about transition."
version = "1.0.0"
id = "artifacts/rohit-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18193

[services.development]
run = "pnpm --filter @workspace/rohit-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rohit-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/rohit-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18193"
BASE_PATH = "/"
